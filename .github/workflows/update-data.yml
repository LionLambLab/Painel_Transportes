name: Atualizar Dados ANP + Indicadores

# ┌─────────────────────────────────────────────────────────────┐
# │  Modos automáticos:                                         │
# │  • Todo dia 14h BRT         → só notícias                  │
# │  • Domingo 06h BRT          → ANP xlsx (1ª tentativa)      │
# │  • Segunda 08h BRT          → ANP xlsx (2ª tentativa)      │
# │  • Segunda 11h BRT          → ANP xlsx (3ª tentativa)      │
# │  • Segunda 14h BRT          → ANP xlsx (4ª tentativa)      │
# │  • Dia 1 e dia 15 do mês    → BCB completo + notícias      │
# │  • Manual (workflow_dispatch) → sempre full                 │
# └─────────────────────────────────────────────────────────────┘

on:
  schedule:
    - cron: '0 17 * * *'
    - cron: '0 9 * * 0'
    - cron: '0 11 * * 1'
    - cron: '0 14 * * 1'
    - cron: '0 17 * * 1'
    - cron: '0 12 1,15 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de execucao'
        required: false
        default: 'full'
        type: choice
        options: [full, news, indicators]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias
        run: pip install requests pandas openpyxl xlrd

      - name: Coletar dados
        run: |
          WEEKDAY=$(date -u +%u)
          DAY=$(date -u +%d)
          EVENT="${{ github.event_name }}"
          MANUAL_MODE="${{ github.event.inputs.mode }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MODE="${MANUAL_MODE:-full}"
          elif [ "$DAY" = "01" ] || [ "$DAY" = "15" ]; then
            MODE="full"
          elif [ "$WEEKDAY" = "0" ] || [ "$WEEKDAY" = "1" ]; then
            MODE="full"
          else
            MODE="news"
          fi
          echo "Modo: $MODE"
          python scripts/fetch_data.py --mode=$MODE

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/indicators.json
          git diff --cached --quiet || git commit -m "$(date -u '+%d/%m/%Y %H:%M UTC')"
          git push
